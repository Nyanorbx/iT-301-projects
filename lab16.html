<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>

    <style>
        .rule.invalid {
         color: red;
        }
    .rule.valid {
    color: green;
    }
    </style>
</head>
<body>
     <Form action="#" id="formid">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Enter Name">

        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter Email here">

        <label for="password">Password</label>
        <input type="password" id ="password" required placeholder="Enter Password">
         <div hidden class="rules" id="password-rules">
         <div id="rule-length" class="rule">✖ At least 6 characters</div>
         <div id="rule-special" class="rule">✖ Must include a special character (!@#$...)</div>
         <div id="rule-uppercase" class="rule">✖ Must include an uppercase letter (A-Z)</div>
        </div>
        
        
        <button type="submit" id ="button">Submit</button>
        <p id="message"></p>

    </Form>
    
    
    <script>
        const name = document.getElementById("name")
        const email = document.getElementById("email")
        const password = document.getElementById("password")
        const button = document.getElementById("button")
        const form = document.getElementById("formid");
        

        
        button.addEventListener("submit", () => {
            
        })

        password.addEventListener("input", () => {
            const passValu = password.value
            const rulesContainer = document.getElementById("password-rules")
            const ruleLength = document.getElementById("rule-length")
            const ruleSpecial = document.getElementById("rule-special")
            const ruleUppercase = document.getElementById("rule-uppercase")

            rulesContainer.hidden = false
            const isLengthValid = passValu.length >= 6
            const isSpecialValid = /[!@#$%^&*(),.?":{}|<>]/.test(passValu);
            const isUppercaseValid = /[A-Z]/.test(passValu);

            ruleLength.classList.toggle("valid", isLengthValid);
            ruleLength.classList.toggle("invalid", !isLengthValid);

            ruleSpecial.classList.toggle("valid", isSpecialValid);
            ruleSpecial.classList.toggle("invalid", !isSpecialValid);

            ruleUppercase.classList.toggle("valid", isUppercaseValid);
            ruleUppercase.classList.toggle("invalid", !isUppercaseValid);
        })

        form.addEventListener("submit", () => {
           event.preventDefault();

           
            
        })
    </script>
</body>
</html>
