<!-- Main booking Section -->
<main>
<section class="Bookings">
<h1>Schedule an Appointment with us!!</h1>
<p> Please fill out the contact sectionm below.</p>


<form action="#" method="POST" class="booking-form">

<!-- Getting contact infomination -->

<fieldset>
    <legend>Contack Information</legend>    

    <label for="full-name">Full Name:</label>
    <input type = "text" id ="full-name" name="fullName" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>

    <label for pnum>Phone Number</label>
    <input type="tel" id="pnum" name="phone" required>

</fieldset>
<!-- Vehicle Infos -->

<fieldset>
    <legend>Vehicle & Service Requested</legend>
    <label for="Vehicle">Vehicle (Year, Make and Model)</label>
    <input type="text" id="Vehicle" name="vehicle" required>

    <label for="service-type">Service Needed</label>
    <select id="service-type" name="SeerviceType" required>
        <option value="">Please Select a Service  below</option>
        <option value="oil-change">Oil & Filter Change</option>
        <option value="brake-inspection">Brake Service and Inspection</option>
        <option value="diagnostics">Engine Diagnostic (OBD2)</option>
        <option value="collision">Collision & Body Repair</option>
        <option value="scheduled-maintenance">Miles Scheduled Maintenance</option>
    </select>   

    <label for="date" >Perferred Service Date</label>
    <input type="date" id="date" name="date" required>

    <label for="notes">Additional Notes</label>
    <textarea id="notes" name="notes" rows="4" placeholder="Describe any noises, dashboard warning lights, or specific requests"></textarea>
</fieldset>
<button type="submit" id="submit-but">Submit Booking Request</button>
</form>

</section>

</main>
